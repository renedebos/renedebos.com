name: Deploy renedebos-site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (= v4.3.0): a floating tag lets a compromised action release
      # run with this repo's secrets. Update the SHA deliberately, not implicitly.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # Gate 1: recordings.json integrity — tag vocabulary, songwriter rules,
      # R2 key conventions, peaks/processing sidecars, orphan song pages.
      - name: Integrity check
        run: python3 scripts/build.py --check
      # Gate 2: the committed generated output must match a fresh build —
      # catches "edited recordings.json (or a template) but forgot to rebuild".
      - name: Verify committed site is current
        run: |
          python3 scripts/build.py
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Committed site is stale — run 'python3 scripts/build.py' locally and commit the result."
            exit 1
          fi
      # Gate 3: the deterministic player-engine suites (player-consolidation
      # plan §6's long-open "wire the tests into an actual deployment gate"
      # item, finally done once Phase 1 for show pages went live everywhere).
      # No npm dependency to install — these import only relative/node: specs
      # (test-fake-dom.mjs hand-rolls the DOM/media surface they touch) — so
      # runs/exits clean with nothing but the runner's preinstalled Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Player engine test suites
        run: |
          for f in scripts/test-*.mjs; do
            echo "::group::$f"
            node "$f" || { echo "::error::$f failed"; exit 1; }
            echo "::endgroup::"
          done
      # Deploys the renedebos-site Worker (static assets + playlist short-link
      # endpoints, config in wrangler.jsonc) — this is what serves renedebos.com
      # via Worker custom domains. The old hannan-audio Pages project is no
      # longer deployed. The wav-download Worker (worker/) deploys separately.
      # wrangler version pinned for the same reason — `npx wrangler` floats to
      # latest, handing the Cloudflare token to whatever shipped overnight.
      # Bump the pin deliberately after checking release notes.
      - name: Deploy renedebos-site Worker
        run: npx wrangler@4.110.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Neither Worker sets Cache-Control on page routes, so Cloudflare's edge
      # cache can serve stale HTML after a deploy — not tied to any one route,
      # immune to client-side cache-busting. Purge everything post-deploy to
      # close the gap. CLOUDFLARE_API_TOKEN needs Zone > Cache Purge permission
      # (2026-07-13) alongside the Workers permission used above.
      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "::error::Cache purge failed with HTTP $code"
            exit 1
          fi
